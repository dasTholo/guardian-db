[package]
name = "guardian-compute-sdk-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
description = "The #[guardian_task] attribute macro for guardian-compute-sdk"
repository = "https://github.com/wmaslonek/guardian-db/"
publish = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full"] }
